services:
  honcut:
    build: .
    container_name: honcut
    ports:
      - "127.0.0.1:5199:5199"
    volumes:
      - ~/.honcut:/root/.honcut                    # SQLite 数据库 + 上传文件
      - ~/.honcut/output:/root/.honcut/output      # 渲染输出目录
      - /Users/soda/knowledge-base:/root/knowledge-base:ro  # KB 素材
    environment:
      - HONCUT_DB_PATH=/root/.honcut/honcut.db
    depends_on:
      honcut-server:
        condition: service_healthy
    networks:
      - honcut-net
    restart: unless-stopped

  honcut-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: honcut-server
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ~/.honcut:/root/.honcut                    # SQLite 数据库 + 上传文件
      - /Users/soda/knowledge-base:/root/knowledge-base:ro  # KB 素材
    environment:
      - HONCUT_DB_PATH=/root/.honcut/honcut.db
      - HONCUT_PORT=8080
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=honcut-media
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=honcut-kb
    depends_on:
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - honcut-net
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: honcut-minio
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - honcut-net
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: honcut-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set honcut-minio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb -p honcut-minio/honcut-media;
      /usr/bin/mc anonymous set download honcut-minio/honcut-media;
      echo 'Bucket created and policy set';
      exit 0;
      "
    networks:
      - honcut-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: honcut-qdrant
    ports:
      - "127.0.0.1:6335:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - honcut-net
    restart: unless-stopped

volumes:
  minio-data:
  qdrant-data:

networks:
  honcut-net:
    driver: bridge
